apiVersion: apps/v1
kind: Deployment
metadata:
  name: iiot-sensor
  namespace: iiot-poc
spec:
  replicas: 1
  selector: { matchLabels: { app: iiot-sensor } }
  template:
    metadata:
      labels: { app: iiot-sensor }
    spec:
      containers:
        - name: sensor
          image: python:3.11-alpine
          env:
            - name: MQTT_HOST
              value: "mosquitto.iiot-poc.svc.cluster.local"
            - name: MQTT_TOPIC
              value: "mine/linea1/telemetry"
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              apk add --no-cache ca-certificates >/dev/null 2>&1 || true
              python -m pip install --no-cache-dir --upgrade pip >/dev/null 2>&1 || true
              pip install --no-cache-dir paho-mqtt
              echo "Starting publisher..."
              python /app/sensor_pub.py
          volumeMounts:
            - name: src
              mountPath: /app
          # Opcional: pequeña probe para ver que publica al menos una vez
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","test -f /tmp/sensor.ready || [ $(($(date +%s)-0)) -gt 10 ]"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: src
          configMap:
            name: sensor-src
