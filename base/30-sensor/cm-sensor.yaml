apiVersion: v1
kind: ConfigMap
metadata:
  name: sensor-src
  namespace: iiot-poc
data:
  sensor_pub.py: |
    import time, json, random, os
    import paho.mqtt.client as mqtt
    host = os.getenv("MQTT_HOST", "mosquitto.iiot-poc.svc.cluster.local")
    topic = os.getenv("MQTT_TOPIC", "mine/linea1/telemetry")
    client = mqtt.Client()
    client.connect(host, 1883, 60)
    while True:
        payload = {
            "sensor": "temp01",
            "value": round(random.uniform(24.0, 28.5), 2),
            "ts": time.time()
        }
        client.publish(topic, json.dumps(payload), qos=0, retain=False)
        time.sleep(3)
