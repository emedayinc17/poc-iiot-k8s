# ~/tsistemas/poc-iiot-k8s/40-network/netpol.yaml

# 1) Default deny: niega todo por defecto en iiot-poc (buena práctica PoC)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: iiot-poc
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 2) Allow iiot traffic: permite solo tráfico entre sensores, mosquitto y health-app (MQTT ingress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-iiot
  namespace: iiot-poc
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: iiot-sensor
        - podSelector:
            matchLabels:
              app: health-app
        - podSelector:
            matchLabels:
              app: attacker   # ⬅️ nuevo: permite solo a pods del Job con este label
      ports:
        - protocol: TCP
          port: 1883


---
# 3) Allow ingress & monitoring: permite al controller Ingress (y a Prometheus en monitoring)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-health-from-ingress-monitoring
  namespace: iiot-poc
spec:
  podSelector:
    matchLabels:
      app: health-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080

---
# 4) Allow egress minimal: permite a pods de iiot-poc resolver DNS y conectar al broker Mosquitto
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-iiot
  namespace: iiot-poc
spec:
  # aplica a TODOS los pods en iiot-poc (podSelector: {}), ajusta si quieres limitar
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # a) permitir conexión al pod mosquitto (TCP:1883)
    - to:
        - podSelector:
            matchLabels:
              app: mosquitto
      ports:
        - protocol: TCP
          port: 1883

    # b) permitir DNS al namespace kube-system (suele ejecutar coredns ahí) UDP:53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # c) (opcional, borrable si no quieres egress Internet) permitir salida a Internet
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-to-iiot
  namespace: iiot-poc
spec:
  podSelector: {}              # aplica a todos los pods en iiot-poc (o filtra por labels si prefieres)
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 80      # health-app (si tu /health corre en 80)
        - protocol: TCP
          port: 1883    # mosquitto
        - protocol: TCP
          port: 10050   # si usas zabbix-agent en pods (opcional)
